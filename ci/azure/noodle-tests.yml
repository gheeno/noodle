# NOOD_0191 — run a project repo's own Noodle tests, from that project's own
# pipeline. A consumable jobs template: the project keeps its build and deploy
# jobs and adds this one alongside them.
#
#   resources:
#     repositories:
#       - repository: noodle
#         type: git                  # or 'github' + endpoint: <service connection>
#         name: Tooling/noodle
#         ref: refs/tags/1.0.0a24     # pin the engine — a moving ref is not a build
#
#   jobs:
#     - template: ci/azure/noodle-tests.yml@noodle
#       parameters:
#         workspaceDir: tests/noodle
#         keyVaultUrl: $(NOODLE_KEYVAULT_URL)
#
# See ci/azure/example-project-pipeline.yml for a complete consumer file, and
# docs/ci-project-repo.md for the walkthrough.
#
# Headless only, on purpose: nobody can watch a browser inside a CI agent, so
# a --headed knob here is a failure mode with no upside. Headed is the local
# demo path (`noodle run --headed` on a developer's machine). A run that needs
# watching afterwards uses the @record_video tag, which attaches to the report.
#
# No LLM is involved at any point. This template only runs `noodle run`.

parameters:
  - name: workspaceDir
    displayName: 'Noodle workspace inside this repo (the dir holding noodle.yaml)'
    type: string
    default: tests/noodle
  # NOOD_0205 — the default is the WORD 'all', not an empty string. Azure's
  # Run-pipeline panel refuses to advance past a blank runtime string
  # parameter, so an empty default made the common case — run the whole suite,
  # by hand — literally unreachable. 'all' is translated away below; '' is
  # still accepted so an automated caller passing it keeps working.
  - name: testTag
    displayName: 'Tag filter — "all" runs every feature and scenario'
    type: string
    default: all
  - name: pool
    displayName: 'Agent pool — pass your own for a self-hosted pool'
    type: object
    default:
      vmImage: ubuntu-latest
  # NOOD_0205 — sharding scales linearly in JOBS, which is the wrong axis: a
  # 29-feature suite listed 31 jobs, a 1000-feature one would list 1002, and
  # every job pays the full setup (two checkouts, pip install, browser
  # download, Allure CLI ≈ 60-90s) to run one file. One job that parallelises
  # INSIDE itself pays that once. Sharding stays as the scaling lever for a
  # suite one agent can no longer finish in time — opt-in, not the shape.
  - name: shard
    displayName: 'Fan out to one agent per .feature file (large suites only)'
    type: boolean
    default: false
  - name: maxParallel
    displayName: 'Matrix width when sharding is on'
    type: number
    default: 4
  - name: parallelProcesses
    displayName: 'Parallel test processes within the job (0 = single process)'
    type: number
    default: 4
  - name: pythonVersion
    type: string
    default: '3.11'
  - name: extras
    displayName: "Extra install group, e.g. '[visual]' — only if the suite uses @visual/@appium"
    type: string
    default: ''
  - name: keyVaultUrl
    displayName: 'Azure Key Vault URL — the ONE secrets knob (see below)'
    type: string
    default: ''
  - name: secretEnv
    displayName: 'Explicit KEY: $(VAR) map, for teams not using Key Vault'
    type: object
    default: {}
  - name: allureVersion
    type: string
    default: '3.14.1'
  - name: historyRuns
    displayName: 'Allure trend runs to retain'
    type: number
    default: 30
  - name: publishAllureTab
    displayName: 'Publish the Allure tab (needs the org-level qameta.allure-azure-pipelines extension; the Tests tab and report artifacts publish regardless)'
    type: boolean
    default: true
  - name: jobName
    type: string
    default: noodle_tests

jobs:
  # Sharding needs the file list before the matrix exists, so discovery is its
  # own job. Skipped entirely when shard=false — one job runs the whole suite.
  - ${{ if eq(parameters.shard, true) }}:
    - job: ${{ parameters.jobName }}_discover
      displayName: 'Discover Noodle feature files'
      pool: ${{ parameters.pool }}
      steps:
        - checkout: self
          path: s/project
        - checkout: noodle
          path: s/noodle
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '${{ parameters.pythonVersion }}'
        - bash: |
            set -euo pipefail
            # Fails (never emits {}) when nothing is found — an empty matrix
            # would make the tests job a no-op and the pipeline would go green
            # having discovered nothing.
            MATRIX=$(python "$(Agent.BuildDirectory)/s/noodle/scripts/list_features.py" --root .)
            echo "##vso[task.setvariable variable=matrix;isOutput=true]$MATRIX"
          name: gen
          displayName: 'List web .feature files'
          workingDirectory: $(Agent.BuildDirectory)/s/project/${{ parameters.workspaceDir }}

  - job: ${{ parameters.jobName }}
    displayName: 'Noodle tests'
    pool: ${{ parameters.pool }}
    ${{ if eq(parameters.shard, true) }}:
      dependsOn: ${{ parameters.jobName }}_discover
      strategy:
        maxParallel: ${{ parameters.maxParallel }}
        matrix: $[ dependencies.${{ parameters.jobName }}_discover.outputs['gen.matrix'] ]
    variables:
      # Explicit checkout paths: with two repos checked out, the default
      # directory names come from the repo names, which this template cannot
      # know. Pinning both makes every path below deterministic.
      projectRoot: $(Agent.BuildDirectory)/s/project
      noodleRoot: $(Agent.BuildDirectory)/s/noodle
      workspace: $(Agent.BuildDirectory)/s/project/${{ parameters.workspaceDir }}
      PLAYWRIGHT_BROWSERS_PATH: $(Pipeline.Workspace)/pw-browsers
      ${{ if eq(parameters.shard, true) }}:
        runTarget: $(featurePath)
      ${{ else }}:
        runTarget: ''
        # NOOD_0205 — one job, one report, and the Allure tab reads it directly
        # (see the publish step below), so it has to be single-file. Job-level,
        # so both `noodle run`'s own after_all report and the fallback
        # generation step below build the same shape.
        NOODLE_ALLURE_SINGLE_FILE: '1'
      # The tag rides inside single quotes so a tag containing a space
      # survives the shell's word-split of $(tagFlag); blank stays blank.
      # NOOD_0205 — 'all' (any case) means the whole suite, same as blank.
      ${{ if and(ne(parameters.testTag, ''), ne(lower(parameters.testTag), 'all')) }}:
        tagFlag: "--tag '${{ parameters.testTag }}'"
      ${{ else }}:
        tagFlag: ''

    steps:
      - checkout: self
        path: s/project
      - checkout: noodle
        path: s/noodle

      # NOOD_0205 — which engine build actually ran. `noodle --version` cannot
      # say: it reads the SHA by walking up from the *package* directory, and
      # CI pip-installs a NON-EDITABLE copy into site-packages with no repo
      # above it, so the banner silently drops the SHA in exactly the place it
      # matters (an editable local install does print it, which is what makes
      # the omission easy to miss). The checkout always has .git.
      - bash: |
          echo "engine sha:  $(git rev-parse HEAD)"
          echo "engine tags: $(git tag --points-at HEAD | tr '\n' ' ')"
          echo "engine head: $(git log -1 --pretty=%s)"
        displayName: 'Engine build provenance'
        workingDirectory: $(noodleRoot)
        continueOnError: true

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '${{ parameters.pythonVersion }}'

      # Keyed on the engine's own constraints.txt — the Playwright version is
      # pinned there, so a shard only re-downloads browsers when that pin moves.
      - task: Cache@2
        displayName: 'Cache Playwright browsers'
        inputs:
          key: '"noodle-pw" | $(noodleRoot)/constraints.txt'
          path: $(Pipeline.Workspace)/pw-browsers

      # Base deps only, pinned by the engine's own constraints.txt. NOT
      # ".[all,llm]" — that set exists to gate the engine's unit suite; running
      # tests needs none of it, and every extra is install time on every run.
      - bash: |
          set -euo pipefail
          EXTRAS='${{ parameters.extras }}'
          # A knob on this template must install what backs it — otherwise the
          # install goes green and the run dies later naming a pip extra the
          # project never asked for. Both cases below go through here.
          add_extra() {
            if [ -z "$EXTRAS" ]; then EXTRAS="[$1]"
            elif ! printf '%s' "$EXTRAS" | grep -q "$1"; then EXTRAS="${EXTRAS%]},$1]"
            fi
          }
          # NOOD_0205 — parallelProcesses != 0 makes `noodle run` take the
          # --parallel path, which needs behavex. Without the extra the job
          # died with "Parallel runs need behavex" the moment 4 became the
          # default (constraints.txt already pins behavex, so this stays
          # reproducible).
          if [ '${{ parameters.parallelProcesses }}' != '0' ]; then
            add_extra parallel
            echo "Parallel run requested — installing with $EXTRAS"
          fi
          KV='${{ parameters.keyVaultUrl }}'
          # NOOD_0193 — Key Vault needs the `azure` extra, and asking every
          # project to remember `extras: '[azure]'` NEXT TO keyVaultUrl is a
          # footgun: without it the run dies at before_all with "the Azure SDK
          # is missing", after the install step went green. Fold it in here.
          # An unexpanded '$(VAR)' means the variable was never set — the same
          # rule hooks._load_keyvault uses to decide there is no vault.
          case "$KV" in
            ''|'$'*) ;;
            *) add_extra azure
               echo "Key Vault configured — installing with $EXTRAS" ;;
          esac
          pip install "$(noodleRoot)$EXTRAS" -c "$(noodleRoot)/constraints.txt"
          # --with-deps apt-gets Playwright's system libraries, which needs
          # root. MS-hosted agents have passwordless sudo; a locked-down
          # self-hosted one does not, and this used to kill the job before any
          # test ran. The browser download itself needs no root, so fall back
          # to it and let the agent image supply the libs.
          if sudo -n true 2>/dev/null; then
            playwright install chromium --with-deps
          else
            echo "##[warning]No passwordless sudo — installing the browser without system deps. If Chromium fails to launch, have an admin run 'playwright install-deps' on this agent image once."
            playwright install chromium
          fi
          noodle --version
        displayName: 'Install Noodle (pinned)'

      - template: steps-allure-cli.yml
        parameters:
          allureVersion: ${{ parameters.allureVersion }}

      # Allure 3 keeps trend history as one JSONL file. Cache keys are
      # immutable, so key on BuildId (never hits, always saves) and let
      # restoreKeys pull the newest previous run. Azure evicts after 7 idle
      # days, and every restore refreshes that clock — history persists as long
      # as runs are less than a week apart.
      - task: Cache@2
        displayName: 'Restore Allure history'
        condition: always()
        continueOnError: true
        inputs:
          key: '"noodle-history" | "$(System.JobName)" | "$(Build.BuildId)"'
          restoreKeys: |
            "noodle-history" | "$(System.JobName)"
          path: $(workspace)/artifacts/reports/allure-history

      - bash: |
          set -o pipefail
          noodle run $(runTarget) --workspace "$(workspace)" --headless $(tagFlag)
        displayName: 'Run Noodle tests'
        env:
          # Pin the classic shared artifacts/ tree: a single-feature run would
          # otherwise route output into that app package's own report/ folder,
          # which the publish steps below don't look in.
          NOODLE_ARTIFACTS_DIR: artifacts
          # A shard IS a slice — a tag filter can legitimately empty one shard
          # while others run, and `noodle run` exits 3 on zero scenarios.
          ${{ if eq(parameters.shard, true) }}:
            NOODLE_ALLOW_EMPTY: '1'
          NOODLE_PARALLEL_PROCESSES: ${{ parameters.parallelProcesses }}
          # Secrets, one knob. Azure exposes NON-secret variable-group values
          # as env automatically; secret ones must be mapped by hand. Rather
          # than make every project list its keys here, point the engine at a
          # Key Vault and map one variable. `secretEnv` is the escape hatch.
          NOODLE_KEYVAULT_URL: ${{ parameters.keyVaultUrl }}
          ${{ each pair in parameters.secretEnv }}:
            ${{ pair.key }}: ${{ pair.value }}

      # after_all builds the report on a normal run. A run that crashed before
      # it has none — generate one so the artifact is never empty. Guarded, so
      # a normal run doesn't generate twice (each generate appends to history).
      - bash: |
          set -euo pipefail
          mkdir -p "$(workspace)/artifacts/allure-results"
          if [ ! -f "$(workspace)/artifacts/reports/allure-report/index.html" ]; then
            python -c "from noodle.reporting import builder; import sys; builder.generate(sys.argv[1], sys.argv[2])" \
              "$(workspace)/artifacts/allure-results" "$(workspace)/artifacts/reports/allure-report"
          fi
          HISTORY="$(workspace)/artifacts/reports/allure-history/history.jsonl"
          if [ -f "$HISTORY" ]; then
            tail -n ${{ parameters.historyRuns }} "$HISTORY" > "$HISTORY.tmp" && mv "$HISTORY.tmp" "$HISTORY"
          fi
        displayName: 'Generate Allure report (if missing)'
        condition: always()

      # `noodle run` only auto-writes a bare markdown RCA on a red single-process
      # run — never the HTML view, never on a clean run. Generate both here so
      # the artifact always has one. NOOD_0204 — delivered as a download, not
      # posted to the run's Extensions tab: rca.md + standalone rca.html ship
      # inside NoodleTestArtifacts-<shard> under reports/.
      - bash: |
          set -euo pipefail
          noodle rca-report --workspace "$(workspace)" --out "$(workspace)/artifacts/reports/rca.md"
          python -c "from pathlib import Path; from noodle.reporting import rca_report as r; import sys; Path(sys.argv[2]).write_text(r.render_html(sys.argv[1]))" \
            "$(workspace)/artifacts/allure-results" "$(workspace)/artifacts/reports/rca.html"
        displayName: 'Generate RCA report'
        condition: always()

      - task: PublishTestResults@2
        displayName: 'Publish to the Tests tab'
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: $(workspace)/artifacts/reports/junit.xml
          testRunTitle: 'Noodle — $(Build.SourceBranchName) — $(System.JobName)'

      # NOOD_0205 — the Allure tab, published from THIS job. Unsharded there is
      # one report and nothing to merge, so the extra job that used to exist
      # only to re-generate it is gone.
      #
      # Two things had to be true at once for the tab to stop publishing
      # nothing: the report must be single-file (NOODLE_ALLURE_SINGLE_FILE
      # above), and `reportDir` must be RELATIVE, resolved against a job that
      # actually has a source tree — the old report job ran `checkout: none`,
      # so an absolute path there published nothing, silently. `testResultsDir`
      # stays absolute. continueOnError because the task needs an org-level
      # marketplace extension: a missing extension degrades the tab, it does
      # not fail the suite.
      - ${{ if and(eq(parameters.shard, false), eq(parameters.publishAllureTab, true)) }}:
        - bash: |
            set -euo pipefail
            rm -rf "$(Build.SourcesDirectory)/allure-report"
            cp -r "$(workspace)/artifacts/reports/allure-report" \
                  "$(Build.SourcesDirectory)/allure-report"
          displayName: 'Stage report for the Allure tab'
          condition: always()
        - task: PublishAllureReport@2
          displayName: 'Publish Allure Report tab'
          condition: always()
          continueOnError: true
          inputs:
            testResultsDir: $(workspace)/artifacts/allure-results
            reportDir: 'allure-report'
            reportName: 'Allure Report'

      # Raw results exist only to feed the suite merge job, which only exists
      # when sharding; nobody consumes result JSON from the user-facing
      # artifact.
      - ${{ if eq(parameters.shard, true) }}:
        - task: PublishPipelineArtifact@1
          displayName: 'Publish raw Allure results'
          condition: always()
          inputs:
            targetPath: $(workspace)/artifacts/allure-results
            artifact: 'noodle-allure-results-$(System.JobName)'
            publishLocation: pipeline

      - bash: rm -rf "$(workspace)/artifacts/allure-results"
        displayName: 'Drop raw results from TestArtifacts'
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: 'Publish test artifacts'
        condition: always()
        inputs:
          targetPath: $(workspace)/artifacts
          artifact: 'NoodleTestArtifacts-$(System.JobName)'
          publishLocation: pipeline

  # NOOD_0205 — sharding only. Unsharded there is one job, one report,
  # and the tab is published from the test job itself (above), so this
  # whole job — and the second report generation it did — is gone.
  - ${{ if eq(parameters.shard, true) }}:
    # One suite-level report across every shard, published as the browsable
    # "Allure Report" tab. The tab needs the free qameta.allure-azure-pipelines
    # extension installed ONCE at organization level — no extension? set
    # publishAllureTab: false; the merged single-file report still publishes as
    # a pipeline artifact either way.
    - job: ${{ parameters.jobName }}_report
      displayName: 'Allure report tab'
      dependsOn: ${{ parameters.jobName }}
      condition: always()
      pool: ${{ parameters.pool }}
      steps:
        - checkout: none

        - template: steps-allure-cli.yml
          parameters:
            allureVersion: ${{ parameters.allureVersion }}

        - task: DownloadPipelineArtifact@2
          displayName: 'Download shard results'
          inputs:
            patterns: 'noodle-allure-results-*/**'
            path: $(Pipeline.Workspace)/shards

        - task: Cache@2
          displayName: 'Restore suite Allure history'
          continueOnError: true
          inputs:
            key: '"noodle-history-suite" | "$(Build.BuildId)"'
            restoreKeys: |
              "noodle-history-suite"
            path: $(Pipeline.Workspace)/allure-history

        # --single-file is REQUIRED for the tab: the Qameta extension only
        # uploads a report whose summary.json has meta.singleFile=true, and
        # silently skips a multi-file one ("no report to show"). The same file
        # also opens offline straight from the artifact.
        - bash: |
            set -euo pipefail
            mkdir -p merged allure-history
            cp -r shards/*/. merged/
            HISTORY="$(Pipeline.Workspace)/allure-history/history.jsonl"
            allure awesome --single-file --report-name "Noodle Suite" \
              --output allure-report --history-path "$HISTORY" merged
            if [ -f "$HISTORY" ]; then
              tail -n ${{ parameters.historyRuns }} "$HISTORY" > "$HISTORY.tmp" && mv "$HISTORY.tmp" "$HISTORY"
            fi
          displayName: 'Merge shards + generate suite report'
          workingDirectory: $(Pipeline.Workspace)

        # NOOD_0204 — testResultsDir ONLY, on purpose. `reportDir` is not a
        # declared input in the task's task.json (checked up to extension
        # 2.1.5), its code path logs nothing on success OR failure, and on the
        # deployed 2.1.3 the tab published nothing, silently. The documented
        # path is testResultsDir: the task generates its own single-file report
        # from the merged results (trend history lives in the artifact report
        # below, not the tab). That path reads the job's working directory,
        # which `checkout: none` never creates — hence the mkdir. The task also
        # logs nothing there, hence the DIAG step: delete it once the tab has
        # been seen working.
        - ${{ if eq(parameters.publishAllureTab, true) }}:
          - bash: |
              mkdir -p "$(System.DefaultWorkingDirectory)"
              echo "merged results: $(ls "$(Pipeline.Workspace)/merged" | wc -l) files"
              find "$(Pipeline.Workspace)/allure-report" -name summary.json \
                -exec sh -c 'echo "{}:"; head -c 600 "{}"; echo' \;
            displayName: 'DIAG: state before PublishAllureReport'
            condition: always()
          - task: PublishAllureReport@2
            displayName: 'Publish Allure Report tab'
            inputs:
              testResultsDir: $(Pipeline.Workspace)/merged
              reportName: 'Allure Report'

        - task: PublishPipelineArtifact@1
          displayName: 'Publish single-file Allure report'
          inputs:
            targetPath: $(Pipeline.Workspace)/allure-report
            artifact: 'NoodleAllureReport'
