<!--
  Noodle mark — same 12px pixel grid and palette as the original bowl, now
  steaming. Self-animating: every animation is CSS inside this file, so it
  runs as a plain <img> with no JavaScript, and
  prefers-reduced-motion: reduce freezes it. No external references.
  Shared with the landing page: https://github.com/gheeno/noodle-landing
  (assets/img/noodle-bowl-hot.svg) — MIT, same owner. Keep the two in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 216" width="320" shape-rendering="crispEdges" role="img" aria-label="Noodle Test Framework — pixel-art ramen bowl, steaming hot">
<title>Noodle Test Framework — hot pixel-art ramen bowl</title>
<defs>
  <radialGradient id="heatGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffb03a" stop-opacity=".45"/>
    <stop offset="50%" stop-color="#ff6a2d" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
  </radialGradient>
  <filter id="steamSoften" x="-60%" y="-40%" width="220%" height="200%">
    <feGaussianBlur stdDeviation="1.2"/>
    <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#cbf2ff" flood-opacity=".8"/>
  </filter>
  <filter id="neonRim" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff2d95" flood-opacity=".85"/>
    <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7a1bff" flood-opacity=".5"/>
  </filter>
  <style>
    @keyframes noodle-rise {
      0%   { transform: translateY(28px) scaleX(.8);  opacity: 0; }
      10%  { opacity: 1; }
      65%  { opacity: .85; }
      100% { transform: translateY(-36px) scaleX(1.35); opacity: 0; }
    }
    @keyframes noodle-heat {
      0%, 100% { opacity: .45; transform: scaleY(.9)  scaleX(.97); }
      50%      { opacity: .95; transform: scaleY(1.1) scaleX(1.03); }
    }
    @keyframes noodle-spark {
      0%, 100% { opacity: .15; }
      40%      { opacity: 1; }
      70%      { opacity: .35; }
    }
    .wisp {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: noodle-rise 4.6s ease-out infinite;
    }
    .w2 { animation-duration: 5.6s; animation-delay: -1.9s; }
    .w3 { animation-duration: 4.1s; animation-delay: -3.3s; }
    .w4 { animation-duration: 6.2s; animation-delay: -2.7s; }
    .heat {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: noodle-heat 2.8s ease-in-out infinite;
    }
    .spark  { animation: noodle-spark 1.3s steps(3, end) infinite; }
    .spark2 { animation-delay: -.45s; animation-duration: 1.7s; }
    .spark3 { animation-delay: -.9s;  animation-duration: 1.1s; }
    @media (prefers-reduced-motion: reduce) {
      .wisp, .heat, .spark { animation: none; }
      .wisp { opacity: .6; }
    }
  </style>
</defs>

<rect x="0" y="0" width="288" height="216" fill="none"/>

